<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luiz Simões</title>
<meta name="description" content="Luiz Simões — AI agent developer." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e2;
    --accent: #2563eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card-bg: #1a1a1a;
      --text: #f2f2f0;
      --muted: #9a9a9a;
      --border: #2b2b2b;
      --accent: #6ea8fe;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 32px;
    text-align: center;
  }

  img.avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.tagline {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  p.summary {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 0.875rem;
    line-height: 1.5;
  }

  nav.links {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  nav.links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  nav.links a:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  nav.links svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  footer {
    margin-top: 24px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
